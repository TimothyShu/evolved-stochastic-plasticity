[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "esp"
version = "0.0.1"
description = "evolved-stochastic-plasticity: evolved SNN structure + online three-factor plasticity"
requires-python = ">=3.10"
dependencies = ["jax>=0.4.30", "numpy", "pyyaml"]

[project.optional-dependencies]
cuda = ["jax[cuda12]"]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["esp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
